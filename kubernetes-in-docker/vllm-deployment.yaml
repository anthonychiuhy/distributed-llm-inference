# vllm-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.14.1
          args:
            - "--model"
            - "google/gemma-3-1b-it"
            - "--gpu-memory-utilization"
            - "0.6"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              value: "" # !!!!HUGGINGFACE SECRET TOKEN!!!!
          volumeMounts:
            - name: model-volume
              mountPath: ~/.cache/huggingface/
            - name: shm
              mountPath: /dev/shm
          resources:
            limits:
              nvidia.com/gpu: 1 # requesting 1 GPU
      volumes:
        - name: model-volume
          hostPath:
            path: /root/.cache/huggingface/
            type: Directory
        # vLLM needs to access the host's shared memory for tensor parallel inference.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
