# prometheus-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
          - name: prometheus-config
            mountPath: /etc/prometheus  # Where ConfigMap files are mounted
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config  # References the ConfigMap created