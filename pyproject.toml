[project]
name = "distributed-llm-inference"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi[standard]>=0.128.5",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "prometheus-client>=0.24.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "tiktoken>=0.12.0",
]
